MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, type = ro, file = %O;
    CODE:     start = $0801, size = $2FFF, type = rw, fill = yes, file = %O;
    CHARS:    start = $3800, size = $0800, type = rw, fill = yes, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = CODE,     type = ro;
    CHARS:    load = CHARS,    type = ro;
}
